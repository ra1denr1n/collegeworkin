name: shop
x-app: &app
  build: ./app
  environment: &app-env
    DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    REDIS_URL: redis://redis:6379/0
    CACHE_ENABLED: ${CACHE_ENABLED:-1}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  mem_limit: 200m
  cpus: 0.5
  restart: on-failure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command: >
      redis-server
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app1 }

  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app2 }

  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app3 }

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [app1, app2, app3]
    mem_limit: 64m

  k6:
    image: grafana/k6:latest
    profiles: ["test"]
    environment:
      BASE_URL: http://lb
    volumes:
      - ./k6:/scripts:ro

volumes:
  pgdata:
