# Хранилище кэша: 20 МБ под ключи, до 200 МБ данных
proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:20m
                 max_size=200m inactive=10m use_temp_path=off;

upstream origin {
    server lb:80;          # origin — наш балансировщик
    keepalive 32;
}

server {
    listen 80;

    # Статика отдаётся прямо с edge, до origin не доходит
    location /static/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status "EDGE-STATIC" always;
    }

    location = / {
        root /usr/share/nginx/html/static;
        try_files /index.html =404;
    }

    # Публичные GET-запросы каталога — кэшируем на 10 секунд
    location ~ ^/(products|stats)(/|$) {
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_cache edge;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_methods GET HEAD;              # POST никогда не кэшируется
        proxy_cache_valid 200 10s;
        proxy_cache_valid 404 5s;
        proxy_cache_lock on;                       # защита от cache stampede
        proxy_cache_lock_timeout 2s;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header X-Cache-Status $upstream_cache_status always;   # HIT / MISS / EXPIRED
    }

    # Всё остальное (заказы, admin, health) — без кэша
    location / {
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        add_header X-Cache-Status "BYPASS" always;
    }
}
