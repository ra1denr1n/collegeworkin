name: shop
x-app: &app
  build: ./app
  environment: &app-env
    DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    REDIS_URL: redis://172.30.0.11:6379
    CACHE_ENABLED: ${CACHE_ENABLED:-1}
    RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672/
  depends_on:
    postgres:
      condition: service_healthy
    redis-init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
  mem_limit: 200m
  cpus: 0.5
  restart: on-failure
  networks: [backend]

x-redis-node: &redis-node
  image: redis:7.4-alpine
  command: redis-server /usr/local/etc/redis/redis.conf
  volumes:
    - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
  mem_limit: 64m
  restart: on-failure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [backend]

  redis-1:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.11 } }

  redis-2:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.12 } }

  redis-3:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.13 } }

  redis-4:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.14 } }

  redis-5:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.15 } }

  redis-6:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.16 } }

  redis-init:
    image: redis:7.4-alpine
    volumes:
      - ./redis/init-cluster.sh:/init-cluster.sh:ro
    command: sh /init-cluster.sh
    depends_on: [redis-1, redis-2, redis-3, redis-4, redis-5, redis-6]
    restart: "no"
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    volumes:
      - ./rabbitmq/limits.conf:/etc/rabbitmq/conf.d/20-limits.conf:ro
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  consumer:
    build: ./app
    command: ["python", "consumer.py"]
    environment:
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672/
      PAYMENT_DELAY_SEC: "0.2"
      CONSUMER_PREFETCH: "10"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    restart: on-failure
    networks: [backend]

  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app1 }

  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app2 }

  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app3 }

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [app1, app2, app3]
    mem_limit: 64m
    networks: [backend]

  k6:
    image: grafana/k6:latest
    profiles: ["test"]
    environment:
      BASE_URL: http://lb
    volumes:
      - ./k6:/scripts:ro
    networks: [backend]

volumes:
  pgdata:
  rabbitdata:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          ip_range: 172.30.1.0/24
