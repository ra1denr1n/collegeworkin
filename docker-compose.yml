name: shop
x-app: &app
  build: ./app
  environment: &app-env
    DATABASE_URL: postgresql://shop:shop@pgbouncer:6432/shop_rw
    DATABASE_READ_URLS: postgresql://shop:shop@pgbouncer:6432/shop_ro1,postgresql://shop:shop@pgbouncer:6432/shop_ro2
    DB_STATEMENT_CACHE_SIZE: "0"
    DB_POOL_MAX: "20"
    REDIS_URL: redis://172.30.0.11:6379
    CACHE_ENABLED: ${CACHE_ENABLED:-1}
    RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672/
  depends_on:
    pg-primary:
      condition: service_healthy
    pg-replica1:
      condition: service_healthy
    pg-replica2:
      condition: service_healthy
    pgbouncer:
      condition: service_started
    redis-init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
  mem_limit: 200m
  cpus: 0.5
  restart: on-failure
  networks: [backend]

x-redis-node: &redis-node
  image: redis:7.4-alpine
  command: redis-server /usr/local/etc/redis/redis.conf
  volumes:
    - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
  mem_limit: 64m
  restart: on-failure

services:
  pg-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replpass
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/sql:/sql:ro
    shm_size: 256m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [backend]

  pg-replica1: &pg-replica
    image: postgres:16-alpine
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_HOST: pg-primary
      REPLICATION_USER: replicator
      REPLICATION_PASSWORD: replpass
    entrypoint: ["/bin/sh", "/replica-entrypoint.sh"]
    command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pg-replica1-data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/sql:/sql:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    shm_size: 256m
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    networks: [backend]

  pg-replica2:
    <<: *pg-replica
    volumes:
      - pg-replica2-data:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/sql:/sql:ro

  pgbouncer:
    image: edoburu/pgbouncer:latest
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-replica1:
        condition: service_healthy
      pg-replica2:
        condition: service_healthy
    mem_limit: 64m
    restart: on-failure
    networks: [backend]

  redis-1:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.11 } }

  redis-2:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.12 } }

  redis-3:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.13 } }

  redis-4:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.14 } }

  redis-5:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.15 } }

  redis-6:
    <<: *redis-node
    networks: { backend: { ipv4_address: 172.30.0.16 } }

  redis-init:
    image: redis:7.4-alpine
    volumes:
      - ./redis/init-cluster.sh:/init-cluster.sh:ro
    command: sh /init-cluster.sh
    depends_on: [redis-1, redis-2, redis-3, redis-4, redis-5, redis-6]
    restart: "no"
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    volumes:
      - ./rabbitmq/limits.conf:/etc/rabbitmq/conf.d/20-limits.conf:ro
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  consumer:
    build: ./app
    command: ["python", "consumer.py"]
    environment:
      DATABASE_URL: postgresql://shop:shop@pgbouncer:6432/shop_rw
      DB_STATEMENT_CACHE_SIZE: "0"
      RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672/
      PAYMENT_DELAY_SEC: "0.2"
      CONSUMER_PREFETCH: "10"
    depends_on:
      pg-primary:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    restart: on-failure
    networks: [backend]

  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app1 }

  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app2 }

  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app3 }

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app1, app2, app3]
    mem_limit: 64m
    networks: [backend]

  edge:
    image: nginx:1.27-alpine
    volumes:
      - ./edge/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/static:/usr/share/nginx/html/static:ro
    ports:
      - "8080:80"
    depends_on: [lb]
    mem_limit: 128m
    networks: [backend]

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports: ["9090:9090"]
    mem_limit: 200m
    networks: [backend]

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
    mem_limit: 200m
    networks: [backend]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://shop:shop@pg-primary:5432/shop?sslmode=disable
    mem_limit: 64m
    networks: [backend]

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://172.30.0.11:6379
      REDIS_EXPORTER_IS_CLUSTER: "true"
    mem_limit: 64m
    networks: [backend]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    profiles: ["monitoring"]
    command: ["--nginx.scrape-uri=http://lb/stub_status"]
    depends_on: [lb]
    mem_limit: 32m
    networks: [backend]

  k6:
    image: grafana/k6:latest
    profiles: ["test"]
    environment:
      BASE_URL: http://edge
    volumes:
      - ./k6:/scripts:ro
    networks: [backend]

volumes:
  pg-primary-data:
  pg-replica1-data:
  pg-replica2-data:
  rabbitdata:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/16
          ip_range: 172.30.1.0/24
