[databases]
shop_rw  = host=pg-primary  port=5432 dbname=shop
shop_ro1 = host=pg-replica1 port=5432 dbname=shop
shop_ro2 = host=pg-replica2 port=5432 dbname=shop

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 15
min_pool_size = 3
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 60
admin_users = shop
stats_users = shop
ignore_startup_parameters = extra_float_digits
